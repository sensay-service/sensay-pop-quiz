function render(){const t=texts[lang],li=lang==='zh'?0:1;document.documentElement.lang=lang==='zh'?'zh-Hant':'en';document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));$('heading').textContent=submitted?t.results:t.title;$('subtitle').textContent=submitted?t.review:t.intro;$('footer').textContent=lang==='zh'?'提交後，姓名／暱稱、分數與答案將提供給 Sensay workshop 主辦方。':'Your name/nickname, score and answers will be shared with the Sensay workshop organizer.';$('name-label').textContent=lang==='zh'?'姓名／暱稱':'Name / nickname';$('privacy').textContent=lang==='zh'?'請填寫方便主辦方辨識的名稱。':'Enter a name the organizer can recognize.';$('participant').placeholder=lang==='zh'?'例如：王老師':'e.g. Teacher Wang';updateSendStatus();$('submit').textContent=t.submit;$('retry').textContent=t.retry;$('quiz').hidden=submitted;$('results').hidden=!submitted;$('retry').hidden=!submitted;$('score').hidden=!submitted;$('progress').hidden=submitted;$('error').hidden=true;$('questions').replaceChildren();$('results').replaceChildren();
if(!submitted){questions.forEach((q,i)=>{const card=el('div','card'),field=el('fieldset'),legend=el('legend');legend.append(el('span','number',String(i+1)),document.createTextNode(q[lang]));field.append(legend);const options=el('div','options');q.options[li].forEach((label,j)=>{const option=el('label','option'),input=el('input');input.type='radio';input.name=`q${i}`;input.value=String(j);input.checked=answers[i]===j;input.required=true;input.addEventListener('change',()=>{answers[i]=j;$('error').hidden=true;updateProgress()});option.append(input,el('span','',label));options.append(option)});field.append(options);card.append(field);$('questions').append(card)});updateProgress();return}
const n=questions.filter((q,i)=>answers[i]===q.answer).length;$('score').textContent=t.score(n);questions.forEach((q,i)=>{const ok=answers[i]===q.answer,card=el('article','card'),top=el('div','result-title'),title=el('h2');title.append(el('span','number',String(i+1)),document.createTextNode(q[lang]));top.append(title,el('span',`badge ${ok?'correct':'incorrect'}`,ok?t.correct:t.incorrect));card.append(top);if(!ok)card.append(el('p','answer wrong',t.your+q.options[li][answers[i]]));card.append(el('p','answer right',t.answer+q.options[li][q.answer]),el('p','explanation',ok?(i===0?(lang==='zh'?'老師可以建立七種口說練習。':'Teachers can create seven speaking exercise types.'):i===1?(lang==='zh'?'一般練習的錄音上限為 30 秒。':'Standard exercises allow recordings up to 30 seconds long.'):i===2?(lang==='zh'?'Sensay AI 以紅、黃、綠呈現發音回饋。':'Sensay AI uses red, yellow and green for pronunciation feedback.'):(lang==='zh'?'連續七天每天提交錄音，就會獲得彩虹！':'Submit a recording every day for seven consecutive days to earn a rainbow!')):q.explain[li]));if(!ok&&q.image){const figure=el('figure'),img=el('img');img.src=q.image;img.alt=q.alt[li];img.loading='lazy';figure.append(img,el('figcaption','',t.figure));card.append(figure)}$('results').append(card)})}
function updateProgress(){$('progress').textContent=texts[lang].count(answers.filter(a=>a!==null).length)}
document.querySelectorAll('[data-lang]').forEach(button=>button.addEventListener('click',()=>{lang=button.dataset.lang;render()}));
$('quiz').addEventListener('submit',event=>{event.preventDefault();const missing=answers.indexOf(null);if(missing!==-1){$('error').textContent=texts[lang].missing;$('error').hidden=false;document.querySelector(`input[name="q${missing}"]`).focus();return}participant=$('participant').value.trim();if(!participant){$('error').textContent=lang==='zh'?'請填寫姓名／暱稱。':'Please enter your name or nickname.';$('error').hidden=false;$('participant').focus();return}payload={name:participant,answers:answers.slice()};submitted=true;sendState='sending';render();$('heading').focus();window.scrollTo({top:0,behavior:'smooth'});sendSubmission()});
$('retry').addEventListener('click',()=>{submitted=false;sendState='idle';payload=null;answers.fill(null);render();$('heading').focus();window.scrollTo({top:0,behavior:'smooth'})});
function updateSendStatus(){const visible=submitted&&sendState!=='idle';$('send-status').hidden=!visible;$('send-again').hidden=!(submitted&&sendState==='error');$('retry').disabled=sendState==='sending';const messages={zh:{sending:'正在傳送作答紀錄…',sent:'已送出作答紀錄。請由主辦方在試算表確認收件。',error:'傳送未完成，請檢查網路後重試。'},en:{sending:'Sending your answers…',sent:'Answers sent. The organizer can confirm receipt in the spreadsheet.',error:'The request did not complete. Check your connection and try again.'}};$('send-status').textContent=messages[lang][sendState]||'';$('send-again').textContent=lang==='zh'?'重試傳送':'Retry sending'}
async function sendSubmission(){if(!payload)return;sendState='sending';updateSendStatus();const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),20000);try{await fetch(ENDPOINT,{method:'POST',mode:'no-cors',credentials:'omit',body:new URLSearchParams({data:JSON.stringify(payload)}),signal:controller.signal});sendState='sent'}catch{sendState='error'}finally{clearTimeout(timer);updateSendStatus()}}
$('send-again').addEventListener('click',sendSubmission);render();
</script></body></html>
